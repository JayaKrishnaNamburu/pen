name: workspace-pins

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  workspace-pins:
    name: API7 workspace pins
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check workspace pin inventory
        run: node scripts/workspace-pins.mjs
