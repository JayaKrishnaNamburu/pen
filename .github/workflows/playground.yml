name: Playground

# Compile on every PR. Ship to Cloudflare only from the default branch.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    name: Compile playground
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pen toolchain
        uses: ./.github/actions/setup
        with:
          turbo-cache-scope: playground

      - name: Type-check the playground
        run: pnpm --filter @input/pen-playground typecheck

      - name: Test playground host helpers
        run: pnpm --filter @input/pen-playground test

      - name: Build the playground
        run: pnpm --filter @input/pen-playground... run build

  ship:
    name: Ship playground
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pen toolchain
        uses: ./.github/actions/setup
        with:
          turbo-cache-scope: playground

      - name: Build the playground
        run: pnpm --filter @input/pen-playground... run build

      - name: Deploy to Cloudflare
        working-directory: playground
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  playground:
    name: All playground jobs
    if: always()
    needs: [compile, ship]
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require the playground to have compiled
        uses: ./.github/actions/require-jobs
        with:
          needs: ${{ toJSON(needs) }}
          allow-skipped: ship
