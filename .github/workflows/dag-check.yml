name: DAG check

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  dag:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check API1 dependency DAG
        run: node scripts/dag-check.mjs
