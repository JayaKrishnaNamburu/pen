name: no-unstyled-focus

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  no-unstyled-focus:
    name: AX5 no-unstyled-focus
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check unstyled-focus inventory
        run: node scripts/no-unstyled-focus.mjs
