name: ts-nocheck inventory

on:
  workflow_dispatch:

jobs:
  inventory:
    name: CH1 @ts-nocheck inventory
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Report @ts-nocheck inventory
        run: node scripts/ts-nocheck-inventory.mjs
