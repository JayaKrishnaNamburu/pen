name: no-bidi-override

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  no-bidi-override:
    name: RI1 no-bidi-override
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check bidi-override inventory
        run: node scripts/no-bidi-override.mjs
