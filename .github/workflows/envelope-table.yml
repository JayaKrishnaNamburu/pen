name: Envelope table

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  envelope-table:
    name: SCALE1 envelope table
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Diff generated envelope table
        run: |
          node scripts/envelope-table.mjs
          git diff --exit-code -- packages/tooling/test/ENVELOPE.md
