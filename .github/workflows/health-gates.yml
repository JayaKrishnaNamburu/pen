name: Health gates

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

jobs:
  health-gates:
    name: CH1–CH9
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run code-health gates
        run: node scripts/health-gates.mjs
