name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect e2e-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            e2e:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'playwright.config.ts'
              - 'playground/**'
              - 'packages/core/**'
              - 'packages/crdt/yjs/**'
              - 'packages/extensions/undo/**'
              - 'packages/rendering/react/**'
              - 'packages/schema/default/**'
              - 'packages/types/**'

  validate:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint repository surfaces
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Check API reports
        run: node scripts/api-reports.mjs

      - name: Check types-package purity
        run: node scripts/types-purity.mjs

      - name: Check @internal stripping
        run: node scripts/strip-internal.mjs

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

  e2e:
    name: e2e-${{ matrix.engine }}
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # chromium blocks the merge. webkit and firefox report only, until their
    # first fully green run — same staging as the conformance matrix.
    continue-on-error: ${{ matrix.engine != 'chromium' }}

    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright ${{ matrix.engine }}
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - name: Run browser end-to-end tests
        run: pnpm exec playwright test --project=${{ matrix.engine }}

      - name: Upload Playwright artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
