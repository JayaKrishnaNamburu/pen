name: README sections

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  readme-sections:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check DOC4 per-package README sections
        run: node scripts/readme-sections.mjs
