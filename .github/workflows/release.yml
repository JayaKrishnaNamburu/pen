name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance (changeset publish --provenance / NPM_CONFIG_PROVENANCE)

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint repository surfaces
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Check API reports
        run: node scripts/api-reports.mjs

      - name: Check types-package purity
        run: node scripts/types-purity.mjs

      - name: Check @internal stripping
        run: node scripts/strip-internal.mjs

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Check published package metadata
        run: node scripts/sync-package-metadata.mjs --check

      - name: Check published packages share one train version
        run: node scripts/release-check.mjs --version-sync

      - name: Lint published package exports
        run: node scripts/release-check.mjs --publint

      - name: Check published package types
        run: node scripts/release-check.mjs --attw

      - name: Check bundle size against baseline
        run: node scripts/size-limit.mjs

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Tag the release train
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "Train tag v${version} already exists"
            exit 0
          fi
          git tag "v${version}"
          git push origin "v${version}"
