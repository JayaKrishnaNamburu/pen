name: no-selection-state-properties

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  no-selection-state-properties:
    name: Wave 5.1 no-selection-state-properties
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check SelectionState property inventory
        run: node scripts/no-selection-state-properties.mjs
