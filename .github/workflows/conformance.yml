# Wave 0.6 CI wiring. New file so this does not race H.7 / H.8 / E.4 edits to ci.yml.
# coverage:rules lives at scripts/coverage-rules.mjs (Wave 0.6). The conformance
# package script delegates there. Do not rebuild the harness in this workflow.

name: Conformance

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-rules:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Self-test coverage:rules fixture
        run: node scripts/coverage-rules.mjs --self-test

      - name: Check claimed-scope rule coverage
        run: node scripts/coverage-rules.mjs

      - name: Check message catalog completeness
        run: node scripts/catalog-check.mjs

  conformance-engine:
    name: conformance-${{ matrix.engine }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # chromium blocks the merge. webkit and firefox report only until a
    # conformance-${{ matrix.engine }} job on THIS workflow finishes the
    # Playwright suite with 0 failed. Playground e2e green is a different
    # matrix (ci.yml) and does not promote these jobs. Three PR runs on
    # this branch (32479438979, 32480899373, 32481309576) all failed on
    # missing @input/pen-core/dist before any assertion — not engine
    # evidence. Do not flip continue-on-error on that class of red.
    continue-on-error: ${{ matrix.engine != 'chromium' }}

    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build conformance and dependencies
        run: pnpm --filter @input/pen-conformance... build

      - name: Install Playwright ${{ matrix.engine }}
        run: pnpm --filter @input/pen-conformance exec playwright install --with-deps ${{ matrix.engine }}

      - name: Run conformance ${{ matrix.engine }} suite
        run: pnpm --filter @input/pen-conformance run test:${{ matrix.engine }}

      - name: Upload Playwright artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.engine }}-artifacts
          path: |
            packages/tooling/conformance/playwright-report/
            packages/tooling/conformance/test-results/
          if-no-files-found: ignore
          retention-days: 14
