# Static analysis gates. One job per gate so a failure names itself.
#
# Every gate here is a fast, dependency-light check over the source tree
# or the published manifests. Anything that needs a build lives in ci.yml;
# anything that needs a browser lives in conformance.yml or ci.yml's e2e
# matrix.

name: Static gates

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  static-gates:
    name: ${{ matrix.gate }}
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Code health: ts-nocheck, empty skips, `this: any`, runtime
          # console calls, orphan packages.
          - gate: ch-gates
            command: pnpm ch-gates
          # The model adapter exposes one door (.stream()); only the egress
          # facet may call it.
          - gate: ai-egress-one-door
            command: node scripts/ai-egress-one-door.mjs
          # TSDoc coverage ratchet: the undocumented count may only decrease.
          # Switch to --strict once the count reaches zero.
          - gate: api-docs-coverage
            command: pnpm api-docs-coverage
          # Every capability-matrix cell that claims a surface must name a
          # path that exists outside the playground.
          - gate: capability-matrix
            command: pnpm capability-matrix
          # The license positioning stays accurate: no stray source-available
          # or commercial wording outside the decision record.
          - gate: positioning-check
            command: node scripts/positioning-check.mjs
          # Conformance mirrors stay assignable both ways to the production
          # type they name.
          - gate: conformance-mirror-drift
            command: node scripts/conformance-mirror-drift.mjs
          # CATALOG.md and the core command registry must agree.
          - gate: command-catalog-check
            command: node scripts/command-catalog-check.mjs
          # Every diagnostic code has a message catalog entry.
          - gate: catalog-check
            command: node scripts/catalog-check.mjs
          # Published manifests match what sync-package-metadata would write
          # (repository.url, engines.node, files, publishConfig, LICENSE.md).
          - gate: package-metadata
            command: node scripts/sync-package-metadata.mjs --check
          # Generated envelope table must match baselines/envelope.json.
          # Table diff only; timing lives in bench.yml.
          - gate: bench-envelope-drift
            command: node scripts/bench-envelope-drift.mjs
          # npm provenance preconditions. Zero tags prints UNEXERCISED
          # rather than failing.
          - gate: provenance-preconditions
            command: node scripts/release-check.mjs --provenance-preconditions
          # MIGRATION.md must stay mechanically true: export claims, origin
          # union, yjs peer, named paths, and any fenced samples typecheck.
          - gate: migration-guide-check
            command: node scripts/migration-guide-check.mjs
          # Published package dependency layers follow the types -> crdt ->
          # core -> extensions DAG.
          - gate: dag-check
            command: node scripts/dag-check.mjs
          # Installing @input/pen-core must not pull extensions, renderers,
          # or presets.
          - gate: core-clean-install
            command: node scripts/core-clean-install.mjs
          # Every published package exports "."; extra keys need a reason.
          - gate: published-exports
            command: node scripts/published-exports.mjs
          # No workspace:* pins or dist re-exports in published manifests.
          - gate: workspace-pins
            command: node scripts/workspace-pins.mjs
          # Each published package README carries the required sections.
          - gate: readme-sections
            command: node scripts/readme-sections.mjs
          # The generated envelope table must match its fixture metadata.
          - gate: envelope-table
            command: |
              node scripts/envelope-table.mjs
              git diff --exit-code -- packages/tooling/test/ENVELOPE.md

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.gate }}
        run: ${{ matrix.command }}

  doc-refs:
    name: doc-refs
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check documentation refs
        run: pnpm doc-refs
