# Static analysis gates. One job per gate so a failure names itself.
#
# The gate list lives in scripts/gates.json, not in this file. The matrix
# below is built from it and `pnpm verify` runs the same list locally, so a
# gate cannot exist on CI and be missing from the command contributors are
# told to run. Each entry carries its own description; that text is printed
# by the job, which is why the per-gate comments that used to live here are
# gone rather than lost.
#
# Most gates here are fast and dependency-light: source tree or published
# manifests only. The few that read built output declare `needsBuild` in
# gates.json and pay for `pnpm build` in their own leg, so the cheap gates
# stay cheap. Anything that needs a browser lives in conformance.yml or in
# the ci.yml e2e matrix.

name: Static gates

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-gates-${{ github.ref }}
  # Superseded pull-request runs are cancelled; pushes to a release branch
  # are not, so every commit on main keeps a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate-list:
    name: gate-list
    timeout-minutes: 5
    runs-on: ubuntu-latest

    outputs:
      gates: ${{ steps.read.outputs.gates }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read scripts/gates.json
        id: read
        # Heredoc delimiters rather than `echo "gates=$(...)"`: gate
        # descriptions contain backticks and quotes, which a double-quoted
        # echo would hand to the shell.
        run: |
          jq -e 'length > 0' scripts/gates.json > /dev/null
          {
            echo "gates<<GATES_EOF"
            jq -c . scripts/gates.json
            echo "GATES_EOF"
          } >> "$GITHUB_OUTPUT"

  static-gate:
    name: ${{ matrix.gate.id }}
    needs: gate-list
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.gate-list.outputs.gates) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Pen toolchain
        uses: ./.github/actions/setup
        with:
          turbo-cache-scope: ${{ matrix.gate.needsBuild && 'static-gate' || '' }}

      - name: Build packages
        # Only the gates that read dist/ or resolve workspace types. The rest
        # would pay several minutes for output they never open.
        if: matrix.gate.needsBuild
        run: pnpm build

      - name: Run ${{ matrix.gate.id }}
        env:
          # Through the environment, never interpolated into the script
          # body: `${{ }}` inside `run:` is textual substitution, and these
          # values come from a file a fork controls.
          GATE_COMMAND: ${{ matrix.gate.command }}
          GATE_DESCRIPTION: ${{ matrix.gate.description }}
        run: |
          echo "$GATE_DESCRIPTION"
          echo "\$ $GATE_COMMAND"
          echo
          eval "$GATE_COMMAND"

  doc-refs:
    name: doc-refs
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Pen toolchain
        uses: ./.github/actions/setup
        with:
          turbo-cache-scope: doc-refs

      - name: Build packages
        run: pnpm build

      - name: Check documentation refs
        run: pnpm doc-refs

  changeset:
    name: changeset
    # Pull requests only: the check compares the branch against its base, and
    # a push to main has no base to compare against.
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # changeset-check diffs against the merge base, which a depth-1
          # checkout does not contain.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # changeset-check.mjs imports only node: builtins, so this job skips
          # the workspace install. setup-node@v5 caches for the package manager
          # named in packageManager by default, which would shell out to a pnpm
          # that was never installed, so the cache has to be declined.
          package-manager-cache: false

      - name: Check changeset coverage
        run: node scripts/changeset-check.mjs

  static-gates:
    # The single required check for this workflow. See
    # .github/actions/require-jobs for why the aggregation exists and why
    # `always()` is load-bearing.
    name: static-gates
    if: always()
    needs: [gate-list, static-gate, doc-refs, changeset]
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require every gate to have succeeded
        uses: ./.github/actions/require-jobs
        with:
          needs: ${{ toJSON(needs) }}
          allow-skipped: changeset
