# Static gates that had no npm alias and no workflow of their own.
# New file so this does not race editors of ci.yml / conformance.yml /
# health-gates.yml / the other per-gate workflows.
#
# engines-inventory always exits 0 (35 of 35 ok today). It has an npm
# alias so the documented command exists; it is not a job. HOST3's
# declared floor is written by sync-package-metadata.mjs, held by the
# package-metadata matrix gate (`--check`), and exercised by
# node-matrix.yml — the leftover report does not enforce either.
#
# console-inventory also always exits 0. It is not a job (a permanently
# green check is a defect). CH1–CH9, including blocking CH5
# (`pnpm ch-gates` via scripts/health-gates.mjs), run once per PR in
# health-gates.yml — this matrix does not re-run them (GA10).
# The this-any and ts-nocheck inventories were deleted: CH4/CH1 live
# in ch-gates.

name: Static gates

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  static-gates:
    name: ${{ matrix.gate }}
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: skip-hygiene
            command: pnpm skip-hygiene
          # --strict is the enforcing mode; without it the script cannot fail.
          - gate: renderer-inventory
            command: pnpm renderer-inventory -- --strict
          - gate: ai-egress-one-door
            command: node scripts/ai-egress-one-door.mjs
          # AIB2: PenStreamRequest must not grow an editor field
          # (top-level or nested). Self-tests nested + top-level
          # editor on every run. Was a script with no workflow.
          - gate: pen-stream-request-no-editor
            command: node scripts/pen-stream-request-no-editor.mjs
          # D.5 TSDoc coverage. Ratchet: undocumented count may only
          # decrease (MAX_UNDOCUMENTED in the script). Becomes the hard
          # zero-undocumented DOC3 gate when that constant hits 0.
          # --strict fails on any undocumented symbol; do not use it
          # here until the TSDoc / un-export pass lands.
          - gate: api-docs-coverage
            command: pnpm api-docs-coverage
          # HB1/HB5: every capability-matrix cell that claims a surface
          # names a path that exists and is not in the playground, so a
          # renamed test cannot leave a cell vouching for nothing.
          - gate: capability-matrix
            command: pnpm capability-matrix
          # API8: retired source-available / commercial wording stays
          # in the license decision record.
          - gate: positioning-check
            command: node scripts/positioning-check.mjs
          # In-page conformance mirrors must stay assignable both ways
          # to the production type they name. Compared count is printed
          # so a silent empty glob cannot go green.
          - gate: conformance-mirror-drift
            command: node scripts/conformance-mirror-drift.mjs
          # Wave 4 catalog vs core command registry. Fails when
          # CATALOG.md and defineCommand / commandHandler disagree.
          - gate: command-catalog-check
            command: node scripts/command-catalog-check.mjs
          # API7 / HOST3 / API8: published manifests match what
          # sync-package-metadata.mjs would write (repository.url,
          # engines.node, files, publishConfig, LICENSE.md). Write
          # mode is manual; --check is the PR-blocking hold.
          - gate: package-metadata
            command: node scripts/sync-package-metadata.mjs --check
          # SCALE1: generated envelope table must match
          # baselines/envelope.json. Table-diff only — does not
          # re-run benches. Timing stays in bench.yml and is
          # same-class only.
          - gate: bench-envelope-drift
            command: node scripts/bench-envelope-drift.mjs
          # API7: npm provenance preconditions (id-token, NPM_CONFIG_PROVENANCE,
          # --provenance, repository.url). Outcome is unobservable until the
          # first publish; this holds the static contract. Zero tags is not
          # a failure — it is printed as UNEXERCISED.
          - gate: provenance-preconditions
            command: node scripts/release-check.mjs --provenance-preconditions
          # Wave P exit: MIGRATION.md host-guide mechanical truth.
          # Export claims, origin union, yjs peer, named paths.
          # Samples type-check when present; today's guide has zero fences.
          - gate: migration-guide-check
            command: node scripts/migration-guide-check.mjs
          # HOST4: above-floor allowlist sites must be { path, reason }.
          # Bare path strings are the parking-lot shape and fail.
          - gate: above-floor-api-allowlist
            command: node scripts/above-floor-api-allowlist.mjs
          # The gate-that-catches-gates (`v3-gates.mjs --scope-lint`) was
          # removed with the v5 train: it classified `- GATE` lines in a
          # train's wave files, and with no train executing there is no
          # population to lint. It earned its keep — it caught gates naming
          # deleted packages, where `pnpm --filter` on a selector matching
          # nothing exits 0 and reads green while running no tests. The v5
          # train hit that class three more times by hand (a Playwright spec
          # handed to `node --test`, twice) plus a gate that passed on its own
          # placeholder text. A future train reintroduces the runner and this
          # row with it; until then, review is the only thing checking that a
          # new gate can fail.
          # I15 / GA1: every path-shaped datum in a check instrument
          # resolves against the tree. Blocking — a gate that cannot
          # fail is a defect this repo has already deleted twice.
          # The self-test runs as its own row: --self-test does not also
          # walk the live tree, so one invocation cannot cover both, and
          # a checker whose red-proof never runs in CI is unverified.
          - gate: instrument-paths
            command: pnpm instrument-paths
          - gate: instrument-paths-self-test
            command: node scripts/instrument-paths.mjs --self-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.gate }}
        run: ${{ matrix.command }}

  doc-refs:
    name: doc-refs
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check documentation refs
        run: pnpm doc-refs
