name: Examples

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  smoke:
    name: example-${{ matrix.example }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example: [react, vue, vanilla]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build example from workspace artifacts
        run: pnpm --filter @input/pen-example-${{ matrix.example }}... run build

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke-assert the editor mounts and accepts typed text
        run: pnpm exec playwright test --config examples/playwright.config.ts --project=chromium
        env:
          EXAMPLE: ${{ matrix.example }}

      - name: Upload Playwright artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: example-playwright-${{ matrix.example }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
