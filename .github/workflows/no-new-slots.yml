name: no-new-slots

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  no-new-slots:
    name: SM3 no-new-slots
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check slot inventory
        run: node scripts/no-new-slots.mjs
