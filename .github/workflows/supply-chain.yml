name: Supply chain

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  prod-audit:
    name: Production audit report
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Report production advisories
        continue-on-error: true
        run: pnpm audit --prod

  no-install-scripts:
    name: No published install scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fail if published manifests grow install scripts
        run: node scripts/no-install-scripts.mjs

  sec8-dynamic-code-lint:
    name: SEC8 dynamic-code lint configured
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Assert Wave H.1 SEC8 rules stay error
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const config = readFileSync("eslint.config.mjs", "utf8");
          const required = [
            '"no-eval": "error"',
            '"no-new-func": "error"',
            '"no-implied-eval": "error"',
          ];
          const missing = required.filter((rule) => !config.includes(rule));

          if (missing.length > 0) {
            console.error(
              "SEC8: Wave H.1 configured core dynamic-code bans so Pen stays functional under script-src 'self'. They must remain \"error\":",
            );
            for (const rule of missing) console.error(`  missing ${rule}`);
            process.exit(1);
          }

          console.log(
            "SEC8: no-eval, no-new-func, and no-implied-eval remain error in eslint.config.mjs",
          );
          EOF
